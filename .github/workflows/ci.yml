name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install RBS collection
        run: bundle exec rbs collection install
      # Signatures are generated with the newest Ruby, and older parsers may
      # produce slightly different output.
      - name: Check RBS signatures are up to date
        if: matrix.ruby == '4.0'
        run: |
          bundle exec exe/yarbs --strict
          if [ -n "$(git status --porcelain -- sig)" ]; then
            git status --short -- sig
            echo "::error::sig/ is out of date, run 'bundle exec exe/yarbs' and commit the result"
            exit 1
          fi
      - name: Test and lint
        run: bundle exec rake test standard
      - name: Type check
        run: bundle exec steep check
